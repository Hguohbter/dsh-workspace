<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#8ec7e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="白天街道 + 学校的轻量网页跑酷。">
<title>胖虎快跑</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div class="chip-score"><span class="score" id="score">0</span></div>
      <div class="sub"><span class="coin-dot"></span><span id="coin">0</span></div>
    </div>
    <div class="hud-right">
      <div class="best">最高 <b id="best">0</b></div>
      <button id="mute" class="mute" type="button" aria-label="音效开关">🔊</button>
    </div>
  </div>

  <div id="powerups" class="powerups"></div>

  <div id="start" class="screen">
    <div class="card">
      <div class="avatar-wrap"><img id="startFace" class="face" alt=""></div>
      <h1 id="title">胖虎快跑</h1>
      <p class="who"><b id="startName">胖虎</b> 正从学校一路狂奔回家…</p>
      <div id="charRow" class="char-row"></div>
      <button id="playBtn" class="btn" type="button">开始跑</button>
      <button id="boardBtn" class="btn ghost" type="button">在线排行榜</button>
      <p class="tips">左右滑动换道 · 上滑跳跃 · 下滑翻滚</p>
    </div>
  </div>

  <div id="over" class="screen hidden">
    <div class="card">
      <div class="avatar-wrap"><img id="overFace" class="face" alt=""></div>
      <h2>被逮住了</h2>
      <p class="who"><b id="overName">胖虎</b> 撞上了</p>
      <div class="stats">
        <div><b id="finalScore">0</b><span>分</span></div>
        <div><b id="finalCoin">0</b><span>币</span></div>
      </div>
      <p class="bestline">最高 <b id="overBest">0</b></p>
      <div class="submit-row">
        <input id="nameInput" class="name-input" maxlength="8" placeholder="你的名字" autocomplete="off">
        <button id="submitBtn" class="btn small" type="button">上传成绩</button>
      </div>
      <p class="hint" id="submitHint"></p>
      <button id="retryBtn" class="btn" type="button">再来一局</button>
    </div>
  </div>

  <div id="board" class="screen hidden">
    <div class="card">
      <h2>在线排行榜</h2>
      <p class="who">近 12 小时 · 每人取最高分</p>
      <ol id="boardList" class="board-list"><li class="empty">加载中…</li></ol>
      <div class="row">
        <button id="boardRefresh" class="btn ghost small" type="button">刷新</button>
        <button id="boardClose" class="btn small" type="button">返回</button>
      </div>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="card small">
      <h2>暂停</h2>
      <p class="who">点一下继续跑</p>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
